# /etc/nginx/sites-available/cert-manager
# Copie para /etc/nginx/sites-available/ e faça symlink em sites-enabled

server {
    listen 80;
    server_name certmanager.santahelena.pr.gov.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name certmanager.santahelena.pr.gov.br;

    # Usa o próprio certificado wildcard gerenciado pela aplicação
    ssl_certificate     /etc/letsencrypt/live/santahelena.pr.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/santahelena.pr.gov.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/cert-manager-access.log;
    error_log  /var/log/nginx/cert-manager-error.log;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
